name: Deploy Frontend Preview to GitHub Pages

on: 
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      # 方案一（推荐）：使用 package.json 中的 build 脚本
      - name: Build Vue.js project
        working-directory: ./frontend
        run: |
          chmod +x ./node_modules/.bin/vite
          npm run build

      # 方案二（如果你坚持用 npx vite build，取消下面注释）：
      # - name: Fix permission and build
      #   working-directory: ./frontend
      #   run: |
      #     chmod +x ./node_modules/.bin/vite
      #     npx vite build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4   # 建议升级到 v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist